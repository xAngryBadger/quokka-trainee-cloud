line-length = 88

target-version = "py312"

[lint]
select = [
"E", # pycodestyle — erros de estilo
"W", # pycodestyle — avisos
"F", # pyflakes — imports e variáveis não utilizadas
"I", # isort — ordenação de imports
"UP", # pyupgrade — moderniza sintaxe para Python 3.12+
"B", # flake8-bugbear — anti-padroes e erros comuns
"SIM", # flake8-simplify — simplifica complexidade desnecessária
"C4", # flake8-comprehensions — chamadas list/dict desnecessárias
"S", # flake8-bandit — anti-padroes de segurança
]

ignore = [
"S101", # assert é aceitável em arquivos de teste (ruff auto-exclui test_*)
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
