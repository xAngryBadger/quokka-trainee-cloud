# =============================================================================
# Pipeline CI/CD — Trainee Cloud & IA
# =============================================================================
# 4 stages (lint → test → build → deploy) + SAST bônus no stage test
# Docker-in-Docker para build da imagem; deploy apenas na main com aprovação manual
# =============================================================================

stages:
  - lint
  - test
  - validate-infra
  - build
  - deploy

# Previne pipelines duplicados — apenas pipelines de MR e branch main rodam
workflow:
rules:
- if: $CI_PIPELINE_SOURCE == "merge_request_event"
- if: $CI_COMMIT_BRANCH == "main"
- if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Variáveis globais
# -----------------------------------------------------------------------------
variables:
DOCKER_TLS_CERTDIR: "/certs"
DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE"
DOCKER_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# Cache — keyado em ambos arquivos de requirements para invalidar apenas quando deps mudam
# Dev deps (ruff, bandit, pytest) estão em requirements-dev.txt.
# -----------------------------------------------------------------------------
.cache_template: &cache_config
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
      prefix: "$CI_JOB_NAME"
    paths:
      - .pip-cache/
    policy: pull-push

# =============================================================================
# STAGE: LINT
# =============================================================================
lint:
  stage: lint
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache -r requirements-dev.txt
  script:
    - ruff check app.py test_app.py --config ruff.toml

# =============================================================================
# STAGE: TEST
# =============================================================================
test:
  stage: test
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache -r requirements.txt -r requirements-dev.txt
  script:
    - pytest test_app.py -v --tb=short

# =============================================================================
# STAGE: SAST (bônus) — bandit security scan
# =============================================================================
# Bandit roda scan completo (relatório JSON) e output de severidade alta.
# allow_failure=true por design: SAST expõe findings sem bloquear deploys.
# Para projeto novo, bloquear no SAST arrisca falsos positivos travando pipeline.
# Em produção, considerar gating em severidade HIGH após ajustar exclusões.
sast:
  stage: test
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache -r requirements-dev.txt
  script:
    - bandit -r app.py -f json -o bandit-report.json
    - bandit -r app.py -f txt --severity-level high
  artifacts:
    paths:
      - bandit-report.json
    when: always
  allow_failure: true

# =============================================================================
# STAGE: VALIDATE INFRA — Terraform fmt/validate/plan
# =============================================================================
# Garante que código Terraform está formatado e sintaticamente válido
# antes de qualquer apply. Saída do plan postada como comentário no MR para revisão.
terraform-validate:
  stage: validate-infra
  image: hashicorp/terraform:1.8
  variables:
    TF_IN_AUTOMATION: yes
  before_script:
    - terraform init -backend=false
  script:
    - terraform fmt -check -recursive
    - terraform validate
    - echo "Validação Terraform passou"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

terraform-plan:
  stage: validate-infra
  image: hashicorp/terraform:1.8
  variables:
    TF_IN_AUTOMATION: yes
  before_script:
    - terraform init -backend=false
  script:
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan | tee tfplan.txt
    - terraform show -json tfplan > tfplan.json
  artifacts:
    paths:
      - tfplan.txt
    reports:
      terraform: tfplan.json
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# STAGE: BUILD — Imagem Docker → GitLab Container Registry
# =============================================================================
# Usa DOCKER_BUILDKIT para --mount=type=cache no Dockerfile
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" "$DOCKER_IMAGE_NAME:latest"
        docker push "$DOCKER_IMAGE_NAME:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" "$DOCKER_IMAGE_NAME:$CI_COMMIT_TAG"
        docker push "$DOCKER_IMAGE_NAME:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

# =============================================================================
# STAGE: DEPLOY — deploy ECS simulado (apenas main, aprovação manual)
# =============================================================================
# Em pipeline real, aws-cli estaria instalado e estes comandos
# seriam executados. Para esta simulação, imprimimos para demonstrar o
# fluxo de deploy sem instalar pacotes desnecessários.
deploy:
  stage: deploy
  image: alpine:3.19
  script:
    - echo "============================================"
    - echo "Deploy simulado — AWS ECS"
    - echo "============================================"
    - echo ""
    - echo "Imagem: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - echo "Ambiente: production"
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo ""
    - echo "Comandos para deploy real:"
    - echo " 1. aws ecs update-service --cluster trainee-cluster --service trainee-api-service --force-new-deployment"
    - echo " 2. aws ecs wait services-stable --cluster trainee-cluster --services trainee-api-service"
    - echo " 3. aws elbv2 describe-target-health --target-group-arn \$TARGET_GROUP_ARN"
    - echo ""
    - echo "Deploy simulado concluído com sucesso!"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build
