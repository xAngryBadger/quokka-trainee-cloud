# =============================================================================
# Pipeline CI/CD — Trainee Cloud & IA
# =============================================================================
# 4 stages (lint → test → build → deploy) + bonus SAST in test stage
# Docker-in-Docker for image build; deploy only on main with manual gate
# =============================================================================

stages:
  - lint
  - test
  - build
  - deploy

# Prevent duplicate pipelines — only MR pipelines and main branch pipelines run
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Global variables
# -----------------------------------------------------------------------------
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  DOCKER_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# Cache — keyed on both requirements files so it invalidates only when deps change
# Dev deps (ruff, bandit, pytest) live in requirements-dev.txt.
# -----------------------------------------------------------------------------
.cache_template: &cache_config
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
      prefix: "$CI_JOB_NAME"
    paths:
      - .pip-cache/
    policy: pull-push

# =============================================================================
# STAGE: LINT
# =============================================================================
lint:
  stage: lint
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache -r requirements-dev.txt
  script:
    - ruff check app.py test_app.py --config ruff.toml

# =============================================================================
# STAGE: TEST
# =============================================================================
test:
  stage: test
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache -r requirements.txt -r requirements-dev.txt
  script:
    - pytest test_app.py -v --tb=short

# =============================================================================
# STAGE: SAST (bonus) — bandit security scan
# =============================================================================
# Bandit runs a full scan (JSON report) and a high-severity text output.
# allow_failure=true by design: SAST surfaces findings without blocking deploys.
# For a new project, blocking on SAST risks false positives halting the pipeline.
# In production, consider gating on HIGH severity after tuning exclusions.
sast:
  stage: test
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache -r requirements-dev.txt
  script:
    - bandit -r app.py -f json -o bandit-report.json
    - bandit -r app.py -f txt --severity-level high
  artifacts:
    paths:
      - bandit-report.json
    when: always
  allow_failure: true

# =============================================================================
# STAGE: BUILD — Docker image → GitLab Container Registry
# =============================================================================
# Uses DOCKER_BUILDKIT for --mount=type=cache in Dockerfile
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" "$DOCKER_IMAGE_NAME:latest"
        docker push "$DOCKER_IMAGE_NAME:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" "$DOCKER_IMAGE_NAME:$CI_COMMIT_TAG"
        docker push "$DOCKER_IMAGE_NAME:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

# =============================================================================
# STAGE: DEPLOY — simulated ECS deploy (main only, manual gate)
# =============================================================================
# In a real pipeline, aws-cli would be installed and these commands would
# actually execute. For this simulation we echo them to demonstrate the
# deployment flow without installing unnecessary packages.
deploy:
  stage: deploy
  image: alpine:3.19
  script:
    - echo "============================================"
    - echo "Deploy simulado — AWS ECS"
    - echo "============================================"
    - echo ""
    - echo "Imagem: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - echo "Ambiente: production"
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo ""
    - echo "Comandos para deploy real:"
    - echo " 1. aws ecs update-service --cluster trainee-cluster --service trainee-api-service --force-new-deployment"
    - echo " 2. aws ecs wait services-stable --cluster trainee-cluster --services trainee-api-service"
    - echo " 3. aws elbv2 describe-target-health --target-group-arn \$TARGET_GROUP_ARN"
    - echo ""
    - echo "Deploy simulado com sucesso!"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build
