# =============================================================================
# Pipeline CI/CD — Trainee Cloud & IA
# =============================================================================
# 4 stages (lint → test → build → deploy) + bonus SAST in test stage
# Docker-in-Docker for image build; deploy only on main
# =============================================================================

stages:
  - lint
  - test
  - build
  - deploy

# -----------------------------------------------------------------------------
# Global variables
# -----------------------------------------------------------------------------
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  DOCKER_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# Cache — keyed on requirements.txt so it invalidates only when deps change
# -----------------------------------------------------------------------------
.cache_template: &cache_config
  cache:
    key:
      files:
        - requirements.txt
      prefix: "$CI_JOB_NAME"
    paths:
      - .pip-cache/
    policy: pull-push

# =============================================================================
# STAGE: LINT
# =============================================================================
lint:
  stage: lint
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache ruff
  script:
    - ruff check app.py test_app.py

# =============================================================================
# STAGE: TEST
# =============================================================================
test:
  stage: test
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache -r requirements.txt
  script:
    - pytest test_app.py -v --tb=short

# =============================================================================
# STAGE: SAST (bonus) — bandit security scan
# =============================================================================
sast:
  stage: test
  image: python:3.12-alpine
  <<: *cache_config
  before_script:
    - pip install --cache-dir=.pip-cache bandit
  script:
    - bandit -r app.py -f json -o bandit-report.json || true
    - bandit -r app.py -f txt || true
  artifacts:
    paths:
      - bandit-report.json
    when: always
  allow_failure: true

# =============================================================================
# STAGE: BUILD — Docker image → GitLab Container Registry
# =============================================================================
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" -t "$DOCKER_IMAGE_NAME:latest" .
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - docker push "$DOCKER_IMAGE_NAME:latest"
  allow_failure: true

# =============================================================================
# STAGE: DEPLOY — simulated ECS deploy (main only)
# =============================================================================
deploy:
  stage: deploy
  image: alpine:3.19
  script:
    - echo "============================================"
    - echo "Deploy simulado — AWS ECS"
    - echo "============================================"
    - echo ""
    - echo "Imagem: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
    - echo "Ambiente: production"
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo ""
    - echo "Comandos para deploy real:"
    - echo "  1. aws ecs update-service --cluster trainee-cluster --service trainee-api-service --force-new-deployment"
    - echo "  2. aws ecs wait services-stable --cluster trainee-cluster --services trainee-api-service"
    - echo "  3. aws elbv2 describe-target-health --target-group-arn \$TARGET_GROUP_ARN"
    - echo ""
    - echo "Deploy simulado com sucesso!"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
