services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainee-devops-api
    ports:
      - "5000:5000"
healthcheck:
# Healthcheck Gunicorn com start_period estendido para inicializacao dos workers
test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:5000/health'); assert r.status==200"]
interval: 30s
timeout: 5s
start_period: 15s
retries: 3
restart: unless-stopped
